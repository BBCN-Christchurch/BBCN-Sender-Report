name: Update Sender.net Report

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: "0 9 1 * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug secret presence
        env:
          SENDER_API_TOKEN: ${{ secrets.SENDER_API_TOKEN }}
        run: |
          if [ -z "$SENDER_API_TOKEN" ]; then
            echo "DEBUG: SENDER_API_TOKEN is empty!"
          else
            echo "DEBUG: SENDER_API_TOKEN is set (length: ${#SENDER_API_TOKEN})"
          fi

      - name: Fetch latest data
        env:
          SENDER_API_TOKEN: ${{ secrets.SENDER_API_TOKEN }}
        run: python scripts/fetch_data.py --data-dir data

      - name: Generate report
        run: python scripts/generate_report.py --data-dir data --output-dir docs

      - name: Commit and push updated report and CSV data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/*.csv
          git diff --staged --quiet || git commit -m "Update report data and CSV log [automated]"
          git push
